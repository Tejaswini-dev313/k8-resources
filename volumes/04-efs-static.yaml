apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static 
spec:
  capacity:
    storage: 5Gi 
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce 
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain 
  csi:
    driver: efs.csi.aws.com 
    volumeHandle: fs-0c5a01dc6f13376a5

---
apiVersion: v1 
kind: PersistentVolumeClaim 
metadata: 
  name: efs-static 
spec:  
  volumeName: efs-static
  accessModes:
    - ReadWriteOnce 
  storageClassName: ""
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: efs-static
  labels:
    purpose: efs-static 
spec:
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1c
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: efs-static
      mountPath: /usr/share/nginx/html
  volumes:
  - name: efs-static
    persistentVolumeClaim:
      claimName: efs-static

---
apiVersion: v1
kind: Service
metadata: 
  name: nginx
spec:
  type: LoadBalancer
  selector:
    purpose: efs-static
  ports:
  - name: nginx-svc-port
    protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30007
